apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "games.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "games.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate            # the certificate volume is ReadWriteOnce
  selector:
    matchLabels:
      {{- include "games.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "games.selector" . | nindent 8 }}
      annotations:
        # Restart automatically when the routing or the menu page changes.
        checksum/caddy: {{ include (print $.Template.BasePath "/configmap-caddy.yaml") . | sha256sum }}
        checksum/site: {{ include (print $.Template.BasePath "/configmap-site.yaml") . | sha256sum }}
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: 443
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: site
              mountPath: /srv
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "games.fullname" . }}-caddy
        - name: site
          configMap:
            name: {{ include "games.fullname" . }}-site
        - name: data
          {{- if include "games.persist" . }}
          persistentVolumeClaim:
            claimName: {{ include "games.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
